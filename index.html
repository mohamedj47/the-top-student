    <meta charset="UTF-8" />

    <title>المعلم الذكي - رحلة التفوق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { 
        --font-main: 'Almarai', sans-serif;
        --font-header: 'Cairo', sans-serif;
      }
      body {
        font-family: var(--font-main);
        background-color: #f8fafc;
        color: #1e293b;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      h1, h2, h3, .font-header { font-family: var(--font-header); }
      
      .prose {
        line-height: 2 !important;
        font-size: 1.2rem !important;
        font-weight: 700;
      }
      
      .interactive-prose p, .interactive-prose li {
        padding: 4px 8px;
        transition: all 0.2s;
        border-radius: 8px;
      }
      .interactive-prose p:hover, .interactive-prose li:hover {
        background-color: rgba(79, 70, 229, 0.08);
        cursor: pointer;
        transform: translateX(-5px);
      }
      
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      
      @media print {
        .no-print { display: none !important; }
        body { background: white; }
      }
    </style>
